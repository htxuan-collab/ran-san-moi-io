<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rắn Săn Mồi .IO - Multiplayer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            color: #fff;
        }

        #game-canvas {
            display: block;
            background: #090d16;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* LOBBY / MENU SCREEN */
        #lobby-menu {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.98) 100%);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .menu-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .game-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .game-subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .nickname-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .btn-play {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        /* IN-GAME HUD */
        #hud-layer {
            display: none;
        }

        .leaderboard {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 16px;
            min-width: 160px;
        }

        .leaderboard h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .lb-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .lb-item.me {
            color: #38bdf8;
        }

        .stats-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 18px;
        }

        .stat-val {
            font-size: 1.3rem;
            font-weight: 800;
            color: #10b981;
        }

        .stat-lbl {
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        /* GAME OVER SCREEN */
        #gameover-modal {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 90;
        }

        .go-card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 360px;
            text-align: center;
        }

        .go-title {
            color: #ef4444;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .go-score {
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div class="ui-layer">
        <div id="lobby-menu" class="interactive">
            <div class="menu-card">
                <h1 class="game-title">RẮN SĂN MỒI .IO</h1>
                <p class="game-subtitle">Đồng bộ máy tính & Điện thoại</p>
                <div class="input-group">
                    <label>Tên nhân vật</label>
                    <input type="text" id="nickname" class="nickname-input" placeholder="Nhập biệt danh..." maxlength="12" value="Rắn Săn Mồi">
                </div>
                <button id="btn-start" class="btn-play">VÀO CHƠI NGAY</button>
            </div>
        </div>

        <div id="hud-layer">
            <div class="leaderboard">
                <h3>🏆 BẢNG XẾP HẠNG</h3>
                <div class="lb-list" id="lb-items"></div>
            </div>
            <div class="stats-panel">
                <div class="stat-lbl">Chiều dài rắn</div>
                <div class="stat-val" id="my-score">0</div>
            </div>
        </div>

        <div id="gameover-modal" class="interactive">
            <div class="go-card">
                <div class="go-title">BẠN ĐÃ THUA!</div>
                <p style="color: #94a3b8;">Chạm vách hoặc va chạm:</p>
                <div class="go-score" id="final-score">0</div>
                <button id="btn-restart" class="btn-play" style="background: linear-gradient(135deg, #10b981, #059669);">CHƠI LẠI</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        const lobbyMenu = document.getElementById('lobby-menu');
        const hudLayer = document.getElementById('hud-layer');
        const gameoverModal = document.getElementById('gameover-modal');
        const nicknameInput = document.getElementById('nickname');
        const btnStart = document.getElementById('btn-start');
        const btnRestart = document.getElementById('btn-restart');
        const lbItems = document.getElementById('lb-items');
        const myScoreEl = document.getElementById('my-score');
        const finalScoreEl = document.getElementById('final-score');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let players = {};
        let foods = [];
        let myId = null;
        let mapSize = 2000;

        btnStart.addEventListener('click', () => {
            const name = nicknameInput.value.trim() || "Rắn Săn Mồi";
            socket.emit('join', { name });
            lobbyMenu.style.display = 'none';
            hudLayer.style.display = 'block';
        });

        btnRestart.addEventListener('click', () => {
            gameoverModal.style.display = 'none';
            lobbyMenu.style.display = 'flex';
        });

        // Xử lý điều khiển (Cả Chuột & Cảm ứng Điện thoại)
        function handlePointerMove(clientX, clientY) {
            if (!myId || !players[myId]) return;
            const mouseX = clientX - canvas.width / 2;
            const mouseY = clientY - canvas.height / 2;
            const angle = Math.atan2(mouseY, mouseX);
            socket.emit('turn', angle);
        }

        window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        socket.on('init', (data) => { 
            myId = data.id; 
            if(data.mapSize) mapSize = data.mapSize;
        });

        socket.on('state', (state) => {
            players = state.players;
            foods = state.foods;
            if(state.mapSize) mapSize = state.mapSize;
            
            if (myId && players[myId]) {
                myScoreEl.innerText = players[myId].score || 0;
            } else if (myId && !players[myId] && hudLayer.style.display === 'block') {
                hudLayer.style.display = 'none';
                finalScoreEl.innerText = myScoreEl.innerText;
                gameoverModal.style.display = 'flex';
            }

            updateLeaderboard();
            render();
        });

        function updateLeaderboard() {
            const sorted = Object.values(players).sort((a, b) => b.score - a.score).slice(0, 5);
            lbItems.innerHTML = '';
            sorted.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = `lb-item ${p.id === myId ? 'me' : ''}`;
                item.innerHTML = `<span>${idx + 1}. ${p.name}</span><span>${p.score}</span>`;
                lbItems.appendChild(item);
            });
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const me = players[myId];
            const cameraX = me ? me.x : 0;
            const cameraY = me ? me.y : 0;

            ctx.save();
            ctx.translate(canvas.width / 2 - cameraX, canvas.height / 2 - cameraY);

            // 1. Vẽ Khung Vách Ranh Giới Đỏ (Nơi chạm vào sẽ chết)
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 10;
            ctx.strokeRect(-mapSize, -mapSize, mapSize * 2, mapSize * 2);

            // 2. Vẽ Lưới Nền
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = -mapSize; x <= mapSize; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, -mapSize); ctx.lineTo(x, mapSize); ctx.stroke();
            }
            for (let y = -mapSize; y <= mapSize; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(-mapSize, y); ctx.lineTo(mapSize, y); ctx.stroke();
            }

            // 3. Vẽ Thức Ăn
            foods.forEach(f => {
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius || 6, 0, Math.PI * 2);
                ctx.fillStyle = f.color || '#f43f5e';
                ctx.fill();
            });

            // 4. Vẽ Rắn
            Object.values(players).forEach(p => {
                if (!p.body || p.body.length === 0) return;

                for (let i = p.body.length - 1; i >= 0; i--) {
                    const seg = p.body[i];
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, 12, 0, Math.PI * 2);
                    ctx.fillStyle = p.color || '#6366f1';
                    ctx.fill();
                }

                const head = p.body[0];
                ctx.font = 'bold 14px Outfit';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, head.x, head.y - 20);
            });

            ctx.restore();
        }
    </script>
</body>
</html>
