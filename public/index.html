<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rắn Săn Mồi .IO - Sảnh Đấu Chuyên Nghiệp</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050b14; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
        canvas { display: block; width: 100%; height: 100%; }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 8, 18, 0.92); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center; z-index: 10;
        }
        .lobby-card {
            background: linear-gradient(160deg, #0d1b2e, #162942);
            border: 2px solid #00f2fe; padding: 30px; border-radius: 28px;
            width: 520px; max-width: 95vw; box-shadow: 0 0 45px rgba(0, 242, 254, 0.3);
            display: flex; flex-direction: column; gap: 18px;
        }
        .lobby-header { text-align: center; }
        .lobby-header h1 {
            color: #00ffcc; font-size: 28px; text-transform: uppercase;
            letter-spacing: 2px; text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .section-label { font-size: 12px; color: #00f2fe; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; margin-bottom: 6px; }

        input[type="text"] {
            width: 100%; padding: 12px 18px; border-radius: 12px;
            border: 1px solid #00f2fe; background: #061325; color: #fff;
            font-size: 16px; outline: none; text-align: center; font-weight: bold;
        }
        input[type="text"]:focus { border-color: #00ffcc; box-shadow: 0 0 12px rgba(0,255,204,0.4); }

        /* Icon Grid selectors */
        .grid-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grid-item {
            background: #08172b; border: 1.5px solid rgba(0,242,254,0.3);
            border-radius: 12px; padding: 10px; text-align: center; cursor: pointer;
            transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .grid-item:hover { border-color: #00f2fe; background: #0d2340; transform: translateY(-2px); }
        .grid-item.active { border-color: #00ffcc; background: rgba(0, 255, 204, 0.15); box-shadow: 0 0 12px rgba(0, 255, 204, 0.3); }
        .grid-item span.icon { font-size: 22px; }
        .grid-item span.title { font-size: 12px; font-weight: bold; color: #e0e0e0; }

        /* Preview Canvas */
        .preview-box {
            background: #040c17; border: 1px dashed rgba(0,242,254,0.4); border-radius: 16px;
            height: 90px; display: flex; justify-content: center; align-items: center; position: relative;
        }

        /* Room Difficulty Selector */
        .room-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .room-btn {
            padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: #081628; color: #aaa; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .room-btn.active { border-color: #00ffcc; color: #00ffcc; background: rgba(0,255,204,0.1); }

        button.start-btn {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: linear-gradient(90deg, #00b894, #00cec9); color: #fff;
            font-size: 20px; font-weight: 800; cursor: pointer; transition: 0.2s;
            box-shadow: 0 6px 25px rgba(0, 206, 201, 0.4); letter-spacing: 1px;
        }
        button.start-btn:hover { transform: scale(1.02); filter: brightness(1.15); }

        #ui-layer { position: absolute; top: 20px; right: 20px; z-index: 5; pointer-events: none; }
        .leaderboard {
            background: rgba(8, 20, 38, 0.85); border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 16px; padding: 15px 20px; width: 230px; backdrop-filter: blur(6px);
        }
        .leaderboard h3 { font-size: 14px; color: #00ffcc; margin-bottom: 10px; text-transform: uppercase; }
        .lb-item { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: #d0d0d0; }
        .lb-item.me { color: #00f2fe; font-weight: bold; }
    </style>
</head>
<body>

<div id="overlay">
    <div class="lobby-card">
        <div class="lobby-header">
            <h1>🐍 RẮN SĂN MỒI .IO</h1>
        </div>

        <div>
            <div class="section-label">👤 Tên Nhân Vật</div>
            <input type="text" id="pName" placeholder="Nhập tên..." maxlength="15" value="Rắn_Siêu_Cấp">
        </div>

        <div>
            <div class="section-label">👁️ Chọn Phụ Kiện Đầu Rắn</div>
            <div class="grid-selector" id="headGrid">
                <div class="grid-item active" data-head="normal"><span class="icon">👀</span><span class="title">Mắt Thường</span></div>
                <div class="grid-item" data-head="sunglasses"><span class="icon">🕶️</span><span class="title">Kính Râm</span></div>
                <div class="grid-item" data-head="crown"><span class="icon">👑</span><span class="title">Vương Miện</span></div>
                <div class="grid-item" data-head="bunny"><span class="icon">🐰</span><span class="title">Tai Thỏ</span></div>
                <div class="grid-item" data-head="wizard"><span class="icon">🧙</span><span class="title">Phù Thủy</span></div>
            </div>
        </div>

        <div>
            <div class="section-label">🎨 Chọn Màu Sắc & Skin</div>
            <div class="grid-selector" id="skinGrid">
                <div class="grid-item active" data-skin="0"><span class="icon">💎</span><span class="title">Cyber Neon</span></div>
                <div class="grid-item" data-skin="1"><span class="icon">🔥</span><span class="title">Lửa Thiêng</span></div>
                <div class="grid-item" data-skin="2"><span class="icon">👑</span><span class="title">Hoàng Kim</span></div>
                <div class="grid-item" data-skin="3"><span class="icon">🔮</span><span class="title">Mộng Mơ</span></div>
                <div class="grid-item" data-skin="4"><span class="icon">🍃</span><span class="title">Ngọc Bích</span></div>
                <div class="grid-item" data-skin="5"><span class="icon">🌋</span><span class="title">Dung Nham</span></div>
            </div>
        </div>

        <div>
            <div class="section-label">🏟️ Chọn Phòng Đấu</div>
            <div class="room-selector">
                <div class="room-btn active" data-room="easy">🌱 Phòng Dễ</div>
                <div class="room-btn" data-room="medium">⚔️ Trung Bình</div>
                <div class="room-btn" data-room="hard">🔥 Đấu Trường Khó</div>
            </div>
        </div>

        <button class="start-btn" id="joinBtn">CHƠI NGAY ONLINE</button>
    </div>
</div>

<div id="ui-layer">
    <div class="leaderboard">
        <h3>🏆 BẢNG XẾP HẠNG</h3>
        <div id="lbContent"></div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    let selectedSkin = 0;
    let selectedHead = 'normal';
    let selectedRoom = 'easy';

    // Xử lý chọn giao diện sảnh
    document.querySelectorAll('#headGrid .grid-item').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('#headGrid .grid-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            selectedHead = item.dataset.head;
        });
    });

    document.querySelectorAll('#skinGrid .grid-item').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('#skinGrid .grid-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            selectedSkin = Number(item.dataset.skin);
        });
    });

    document.querySelectorAll('.room-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedRoom = btn.dataset.room;
        });
    });

    let myId = null;
    let players = {};
    let foods = [];
    let worldSize = 4000;
    let isPlaying = false;

    const DEFAULT_SKINS = [
        ['#00f2fe', '#4facfe'],
        ['#ff0844', '#ffb199'],
        ['#f12711', '#f5af19'],
        ['#b224ef', '#7579ff'],
        ['#11998e', '#38ef7d'],
        ['#fc4a1a', '#f7b733']
    ];

    let myPos = { x: 2000, y: 2000, angle: 0, score: 0, segments: [], speed: 4 };
    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };

    document.getElementById('joinBtn').onclick = () => {
        const name = document.getElementById('pName').value.trim() || 'Rắn_Săn_Mồi';
        socket.emit('joinRoom', { 
            name, 
            skinIndex: selectedSkin,
            headType: selectedHead,
            roomType: selectedRoom
        });
        document.getElementById('overlay').style.display = 'none';
        isPlaying = true;
    };

    socket.on('initData', (data) => {
        myId = data.id;
        foods = data.foods;
        worldSize = data.worldSize;
    });

    socket.on('gameState', (data) => {
        players = data.players;
        updateLeaderboard();
    });

    socket.on('foodUpdated', (newFoods) => {
        foods = newFoods;
    });

    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    function updateLeaderboard() {
        const sorted = Object.values(players).sort((a, b) => b.score - a.score).slice(0, 5);
        let html = '';
        sorted.forEach((p, idx) => {
            const isMe = p.id === myId;
            html += `<div class="lb-item ${isMe ? 'me' : ''}">
                <span>${idx + 1}. ${p.name}</span>
                <span>${Math.floor(p.score)} điểm</span>
            </div>`;
        });
        document.getElementById('lbContent').innerHTML = html;
    }

    function gameLoop() {
        if (isPlaying && players[myId]) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            myPos.angle = Math.atan2(mouse.y - cy, mouse.x - cx);

            myPos.x += Math.cos(myPos.angle) * myPos.speed;
            myPos.y += Math.sin(myPos.angle) * myPos.speed;

            myPos.x = Math.max(50, Math.min(worldSize - 50, myPos.x));
            myPos.y = Math.max(50, Math.min(worldSize - 50, myPos.y));

            if (!myPos.segments || myPos.segments.length === 0) {
                myPos.segments = Array(20).fill({ x: myPos.x, y: myPos.y });
            }
            myPos.segments.unshift({ x: myPos.x, y: myPos.y });
            const maxLen = 20 + Math.floor(myPos.score / 10);
            while (myPos.segments.length > maxLen) {
                myPos.segments.pop();
            }

            socket.emit('updatePlayer', {
                x: myPos.x,
                y: myPos.y,
                angle: myPos.angle,
                score: myPos.score,
                segments: myPos.segments
            });

            // Ăn thức ăn
            foods.forEach(f => {
                const d = Math.hypot(myPos.x - f.x, myPos.y - f.y);
                if (d < 25) {
                    myPos.score += f.score || 10;
                    socket.emit('eatFood', f.id);
                }
            });
        }

        // Vẽ màn hình
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2 - myPos.x, canvas.height / 2 - myPos.y);

        // 1. Vẽ lưới bản đồ
        ctx.strokeStyle = '#0f1d30';
        ctx.lineWidth = 1;
        const gridSize = 80;
        const startX = Math.floor((myPos.x - canvas.width) / gridSize) * gridSize;
        const endX = Math.ceil((myPos.x + canvas.width) / gridSize) * gridSize;
        const startY = Math.floor((myPos.y - canvas.height) / gridSize) * gridSize;
        const endY = Math.ceil((myPos.y + canvas.height) / gridSize) * gridSize;

        for (let x = startX; x < endX; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, endY); ctx.stroke();
        }
        for (let y = startY; y < endY; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(endX, y); ctx.stroke();
        }

        // 2. Viền bản đồ
        ctx.strokeStyle = '#00f2fe';
        ctx.lineWidth = 8;
        ctx.shadowColor = '#00f2fe';
        ctx.shadowBlur = 15;
        ctx.strokeRect(0, 0, worldSize, worldSize);
        ctx.shadowBlur = 0;

        // 3. Vẽ Thức ăn
        foods.forEach(f => {
            ctx.font = `${f.size * 1.5}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(f.emoji || '🍎', f.x, f.y);
        });

        // 4. Vẽ Rắn các người chơi
        Object.values(players).forEach(p => {
            if (!p.segments || p.segments.length === 0) return;

            const skinColors = DEFAULT_SKINS[p.skinIndex % DEFAULT_SKINS.length] || DEFAULT_SKINS[0];

            // Thân rắn
            for (let i = p.segments.length - 1; i >= 0; i--) {
                const seg = p.segments[i];
                const radius = 16 - (i / p.segments.length) * 4;

                ctx.fillStyle = i % 2 === 0 ? skinColors[0] : skinColors[1];
                ctx.beginPath();
                ctx.arc(seg.x, seg.y, Math.max(8, radius), 0, Math.PI * 2);
                ctx.fill();
            }

            // Đầu rắn & Trang phục
            const head = p.segments[0] || { x: p.x, y: p.y };
            ctx.save();
            ctx.translate(head.x, head.y);
            ctx.rotate(p.angle);

            // Mắt thường
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(6, -8, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(8, -8, 2.5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(6, 8, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(8, 8, 2.5, 0, Math.PI * 2); ctx.fill();

            // Vẽ phụ kiện theo lựa chọn
            if (p.headType === 'sunglasses') {
                ctx.fillStyle = '#111';
                ctx.fillRect(2, -12, 8, 24);
            } else if (p.headType === 'crown') {
                ctx.font = '16px serif';
                ctx.fillText('👑', -4, -14);
            } else if (p.headType === 'bunny') {
                ctx.font = '16px serif';
                ctx.fillText('🐰', -4, -14);
            } else if (p.headType === 'wizard') {
                ctx.font = '16px serif';
                ctx.fillText('🧙', -4, -14);
            }

            ctx.restore();

            // Tên người chơi
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 4;
            ctx.fillText(p.name, head.x, head.y - 28);
            ctx.shadowBlur = 0;
        });

        ctx.restore();

        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
