<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rắn Săn Mồi .IO - Modern Cyberpunk</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
            color: #fff;
        }

        #game-canvas {
            display: block;
            background: #060913;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* LOBBY UI */
        #lobby-menu {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(17, 24, 39, 0.7) 0%, rgba(3, 7, 18, 0.95) 100%);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .menu-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 32px 28px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.2);
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .input-group {
            margin: 20px 0 16px 0;
            text-align: left;
        }

        .nickname-input {
            width: 100%;
            padding: 14px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .color-options {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .color-btn.active {
            transform: scale(1.15);
            border-color: #fff;
        }

        .btn-play {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
        }

        /* HUD & MINI MAP */
        #hud-layer {
            display: none;
        }

        .leaderboard {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            min-width: 160px;
        }

        .lb-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .lb-item.me { color: #38bdf8; }

        .stats-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 10px 16px;
        }

        /* BẢN ĐỒ THU NHỎ (MINI MAP) */
        #minimap-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 110px;
            height: 110px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        #minimap-canvas {
            width: 100%;
            height: 100%;
        }

        /* GAME OVER */
        #gameover-modal {
            position: absolute;
            inset: 0;
            background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 90;
        }

        .go-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 24px;
            padding: 32px;
            width: 90%;
            max-width: 340px;
            text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div class="ui-layer">
        <div id="lobby-menu" class="interactive">
            <div class="menu-card">
                <h1 class="game-title">RẮN SĂN MỒI</h1>
                <div class="input-group">
                    <input type="text" id="nickname" class="nickname-input" placeholder="Tên của bạn..." maxlength="12" value="Rắn Viễn Tưởng">
                </div>

                <div class="color-options">
                    <button class="color-btn active" style="background: #6366f1;" data-color="#6366f1"></button>
                    <button class="color-btn" style="background: #ec4899;" data-color="#ec4899"></button>
                    <button class="color-btn" style="background: #10b981;" data-color="#10b981"></button>
                    <button class="color-btn" style="background: #f59e0b;" data-color="#f59e0b"></button>
                    <button class="color-btn" style="background: #06b6d4;" data-color="#06b6d4"></button>
                </div>

                <button id="btn-start" class="btn-play">VÀO CHƠI</button>
            </div>
        </div>

        <div id="hud-layer">
            <div class="leaderboard">
                <h3 style="font-size:0.75rem; color:#94a3b8; margin-bottom:8px;">🏆 XẾP HẠNG</h3>
                <div id="lb-items"></div>
            </div>
            <div class="stats-panel">
                <div style="font-size:0.7rem; color:#94a3b8;">CHIỀU DÀI</div>
                <div style="font-size:1.4rem; font-weight:800; color:#10b981;" id="my-score">0</div>
            </div>

            <!-- Bản đồ thu nhỏ -->
            <div id="minimap-container">
                <canvas id="minimap-canvas" width="110" height="110"></canvas>
            </div>
        </div>

        <div id="gameover-modal" class="interactive">
            <div class="go-card">
                <h2 style="color:#ef4444; font-size:1.8rem; margin-bottom:8px;">BẠN ĐÃ THUA!</h2>
                <p style="color:#94a3b8; font-size:0.85rem;">Chiều dài đạt được:</p>
                <div style="font-size:2.5rem; font-weight:900; margin:10px 0;" id="final-score">0</div>
                <button id="btn-restart" class="btn-play" style="background: linear-gradient(135deg, #10b981, #059669);">CHƠI LẠI</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const miniCanvas = document.getElementById('minimap-canvas');
        const miniCtx = miniCanvas.getContext('2d');

        const lobbyMenu = document.getElementById('lobby-menu');
        const hudLayer = document.getElementById('hud-layer');
        const gameoverModal = document.getElementById('gameover-modal');
        const nicknameInput = document.getElementById('nickname');
        const btnStart = document.getElementById('btn-start');
        const btnRestart = document.getElementById('btn-restart');
        const lbItems = document.getElementById('lb-items');
        const myScoreEl = document.getElementById('my-score');
        const finalScoreEl = document.getElementById('final-score');

        let selectedColor = '#6366f1';
        let players = {};
        let foods = [];
        let myId = null;
        let mapSize = 1500;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedColor = btn.getAttribute('data-color');
            });
        });

        btnStart.addEventListener('click', () => {
            const name = nicknameInput.value.trim() || "Rắn Săn Mồi";
            socket.emit('join', { name, color: selectedColor });
            lobbyMenu.style.display = 'none';
            hudLayer.style.display = 'block';
        });

        btnRestart.addEventListener('click', () => {
            gameoverModal.style.display = 'none';
            lobbyMenu.style.display = 'flex';
        });

        // ĐIỀU KHIỂN ĐA ĐIỂM DÀNH CHO ĐIỆN THOẠI & MÁY TÍNH
        function sendAngle(clientX, clientY) {
            if (!myId || !players[myId]) return;
            const dx = clientX - window.innerWidth / 2;
            const dy = clientY - window.innerHeight / 2;
            socket.emit('turn', Math.atan2(dy, dx));
        }

        window.addEventListener('mousemove', (e) => sendAngle(e.clientX, e.clientY));

        // Touch Điện thoại
        function handleMobileTouch(e) {
            if (e.touches && e.touches.length > 0) {
                sendAngle(e.touches[0].clientX, e.touches[0].clientY);
            }
        }
        window.addEventListener('touchstart', handleMobileTouch, { passive: true });
        window.addEventListener('touchmove', handleMobileTouch, { passive: true });

        socket.on('init', (data) => {
            myId = data.id;
            if (data.mapSize) mapSize = data.mapSize;
        });

        socket.on('state', (state) => {
            players = state.players;
            foods = state.foods;
            if (state.mapSize) mapSize = state.mapSize;

            if (myId && players[myId]) {
                myScoreEl.innerText = players[myId].score || 0;
            } else if (myId && !players[myId] && hudLayer.style.display === 'block') {
                hudLayer.style.display = 'none';
                finalScoreEl.innerText = myScoreEl.innerText;
                gameoverModal.style.display = 'flex';
            }

            updateLeaderboard();
        });

        function updateLeaderboard() {
            const sorted = Object.values(players).sort((a, b) => b.score - a.score).slice(0, 5);
            lbItems.innerHTML = '';
            sorted.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = `lb-item ${p.id === myId ? 'me' : ''}`;
                item.innerHTML = `<span>${idx + 1}. ${p.name}</span><span>${p.score}</span>`;
                lbItems.appendChild(item);
            });
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const me = players[myId];
            const cameraX = me ? me.x : 0;
            const cameraY = me ? me.y : 0;

            ctx.save();
            ctx.translate(canvas.width / 2 - cameraX, canvas.height / 2 - cameraY);

            // 1. Ranh giới vách đỏ
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 12;
            ctx.strokeRect(-mapSize, -mapSize, mapSize * 2, mapSize * 2);

            // 2. Lưới ô vuông
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 1;
            for (let x = -mapSize; x <= mapSize; x += 60) {
                ctx.beginPath(); ctx.moveTo(x, -mapSize); ctx.lineTo(x, mapSize); ctx.stroke();
            }
            for (let y = -mapSize; y <= mapSize; y += 60) {
                ctx.beginPath(); ctx.moveTo(-mapSize, y); ctx.lineTo(mapSize, y); ctx.stroke();
            }

            // 3. Thức ăn
            foods.forEach(f => {
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius || 6, 0, Math.PI * 2);
                ctx.fillStyle = f.color || '#f43f5e';
                ctx.fill();
            });

            // 4. Rắn người chơi
            Object.values(players).forEach(p => {
                if (!p.body || p.body.length === 0) return;

                for (let i = p.body.length - 1; i >= 0; i--) {
                    const seg = p.body[i];
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, 12, 0, Math.PI * 2);
                    ctx.fillStyle = p.color || '#6366f1';
                    ctx.fill();
                }

                const head = p.body[0];
                ctx.font = 'bold 13px Outfit';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, head.x, head.y - 20);
            });

            ctx.restore();

            // VẼ MINI MAP (BẢN ĐỒ THU NHỎ)
            renderMinimap();

            requestAnimationFrame(render);
        }

        function renderMinimap() {
            miniCtx.clearRect(0, 0, 110, 110);
            const scale = 110 / (mapSize * 2);

            // Vẽ các chấm rắn trên mini map
            Object.values(players).forEach(p => {
                const mx = (p.x + mapSize) * scale;
                const my = (p.y + mapSize) * scale;
                miniCtx.beginPath();
                miniCtx.arc(mx, my, p.id === myId ? 3.5 : 2, 0, Math.PI * 2);
                miniCtx.fillStyle = p.id === myId ? '#38bdf8' : '#ef4444';
                miniCtx.fill();
            });
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
